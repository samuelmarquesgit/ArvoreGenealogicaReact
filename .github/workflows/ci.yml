name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: backend/docs/openapi.yaml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  docs:
    name: Docs — OpenAPI
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: spec

      - name: Validar OpenAPI
        run: npx --yes @redocly/cli lint spec/openapi.yaml

      - name: Gerar documentação HTML
        run: npx --yes @redocly/cli build-docs spec/openapi.yaml --output redoc/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: redoc/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [backend, frontend, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: deploy/backend

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: deploy/frontend

      - uses: actions/download-artifact@v4
        with:
          name: api-docs
          path: deploy/docs

      - name: Listar artefatos prontos
        run: |
          echo "=== Backend ===" && ls deploy/backend/src/
          echo "=== Frontend ===" && ls deploy/frontend/
          echo "=== Docs ===" && ls deploy/docs/

      # Substitua pelo seu provedor (Railway, Render, Fly.io, AWS, etc.)
      - name: Deploy para produção
        run: echo "Artefatos validados e prontos para deploy."
